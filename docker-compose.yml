services:
  postgres:
    image: postgres:16-alpine
    container_name: pension-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pension
      POSTGRES_PASSWORD: pension
      POSTGRES_DB: pension_db
    ports:
      - "5432:5432"
    volumes:
      - pension_postgres_data:/var/lib/postgresql/data

volumes:
  pension_postgres_data:

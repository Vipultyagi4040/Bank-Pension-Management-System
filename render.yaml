services:
  - type: web
    name: bank-pension-api
    runtime: node
    plan: free
    workingDirectory: apps/api
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npx tsx prisma/seed.ts & npm run start:prod
    preDeployCommand: npx prisma migrate deploy
    buildEnvVars:
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    envVariables:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 1d
      - key: OTP_TTL_MINUTES
        value: 5
      - key: CORS_ORIGINS
        value: https://bank-pension-management-system-admi.vercel.app,https://bank-pension-management-system-port.vercel.app,https://bank-pension-management-system-5.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pension_db
          property: connectionString
    databases:
      - name: pension_db
        plan: free
        type: postgresql
